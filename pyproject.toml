[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-up"
version = "0.2.0"
description = "CLI stock strategy assistant"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Guitenbay" }
]
keywords = ["stock", "cli", "rsi", "a-share", "trading"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "pyyaml>=6",
  "requests>=2",
]

[project.optional-dependencies]
akshare = ["akshare"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
stock-up = "stock_up.cli:app"

[project.urls]
Homepage = "https://github.com/Guitenbay/stock-up"
Repository = "https://github.com/Guitenbay/stock-up"
Issues = "https://github.com/Guitenbay/stock-up/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
